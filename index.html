<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Habia">
<meta name="theme-color" content="#141C16">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-32.png">
<title>Portal Habia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: the studio's project binder made digital. A deep moss band (the living wall of a design office)
   carries identity and navigation; the paper below stays calm; only what needs a decision gets a card; records are
   hairline tables. One accent (moss), oak for materials, amber and brick reserved for exceptions. */
:root{
  --paper:#F5F6F2; --surface:#FFFFFF; --surface-2:#ECEFE8; --surface-3:#DFE5DB;
  --ink:#1B221D; --ink-2:#4B544D; --ink-3:#78827A;
  --line:#DCE1D7; --line-2:#C3CBBE;
  --band:#141C16; --band-ink:#F3F5F0; --band-dim:rgba(243,245,240,.64); --band-line:rgba(243,245,240,.18);
  --accent:#46684B; --accent-ink:#FFFFFF; --accent-soft:#E4ECE3; --accent-line:#B5C9B4;
  --oak:#A47A4E; --oak-soft:#F2E9DE;
  --warn:#8F620F; --warn-soft:#F7ECD2;
  --danger:#9E3F38; --danger-soft:#F6E3E0;
  --neutral-soft:#ECEFE8;
  --shadow-lg:0 24px 60px -24px rgba(20,28,22,.35);
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:6px; --r-sm:4px; --r-lg:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111512; --surface:#181D19; --surface-2:#1F2520; --surface-3:#2A322B;
    --ink:#EDF0EA; --ink-2:#B5BDB4; --ink-3:#8A938B;
    --line:#2A312B; --line-2:#3C453D;
    --band:#0B0F0C; --band-ink:#F3F5F0; --band-dim:rgba(243,245,240,.62); --band-line:rgba(243,245,240,.14);
    --accent:#8FB893; --accent-ink:#0F1A11; --accent-soft:#1E2B20; --accent-line:#3C5540;
    --oak:#CFA172; --oak-soft:#2B2219;
    --warn:#D9A54A; --warn-soft:#2E2514;
    --danger:#E3908A; --danger-soft:#372020;
    --neutral-soft:#232923;
    --shadow-lg:0 24px 60px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111512; --surface:#181D19; --surface-2:#1F2520; --surface-3:#2A322B;
  --ink:#EDF0EA; --ink-2:#B5BDB4; --ink-3:#8A938B;
  --line:#2A312B; --line-2:#3C453D;
  --band:#0B0F0C; --band-ink:#F3F5F0; --band-dim:rgba(243,245,240,.62); --band-line:rgba(243,245,240,.14);
  --accent:#8FB893; --accent-ink:#0F1A11; --accent-soft:#1E2B20; --accent-line:#3C5540;
  --oak:#CFA172; --oak-soft:#2B2219;
  --warn:#D9A54A; --warn-soft:#2E2514;
  --danger:#E3908A; --danger-soft:#372020;
  --neutral-soft:#232923;
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0;color:inherit;text-align:inherit;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2;font-weight:500}
h1{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:-.005em;line-height:1.05}
h2{font-size:16.5px}
h3{font-size:15px}
p{margin:0}
b,strong{font-weight:600}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.right{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Top band */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--band);color:var(--band-ink)}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-mark{font-family:var(--font-display);font-size:26px;line-height:1;white-space:nowrap}
.brand-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--band-dim);white-space:nowrap}
.proto{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--band-line);color:var(--band-dim);padding:3px 8px;border-radius:999px;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{min-height:36px;padding:0 14px;border-radius:999px;color:var(--band-dim);font-weight:500;font-size:14px;white-space:nowrap}
.nav button:hover{color:var(--band-ink)}
.nav button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
.iconbtn{width:36px;height:36px;border-radius:999px;display:inline-grid;place-items:center;border:1px solid var(--band-line);color:var(--band-dim);flex:none}
.iconbtn:hover{color:var(--band-ink);border-color:var(--band-dim)}
.iconbtn svg{width:16px;height:16px}
@media (max-width:720px){
  .topbar-in{padding:10px 16px;gap:10px}
  .nav{width:100%;order:3;margin-left:0}
  .nav button{flex:1;padding:0 8px;font-size:13px;text-align:center}
  .brand-sub{display:none}
}

/* Page */
.page{max-width:1280px;margin:0 auto;padding:28px 20px 48px}
@media (max-width:640px){.page{padding:18px 16px 40px}}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:20px}
.page-head .muted{margin-top:6px}
.head-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.who{display:flex;align-items:center;gap:10px}
.who .t{font-weight:500;font-size:14px;line-height:1.2} .who .s{font-size:12.5px;color:var(--ink-3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.avatar.sm{width:26px;height:26px;font-size:10.5px}
.team{display:flex;gap:6px}
.grid{display:grid;gap:18px;margin-bottom:18px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;gap:8px}
.count{font-size:12.5px;color:var(--ink-3)}
.stack{display:grid;gap:12px}
.empty{color:var(--ink-3);font-size:14px;padding:8px 0}
.note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}

/* Chips, buttons */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--neutral-soft);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8;flex:none}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.plain::before{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn svg{width:15px;height:15px}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Phases */
.phases{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.phases::-webkit-scrollbar{display:none}
.phase{flex:1;min-width:92px}
.phase .bar{height:4px;border-radius:2px;background:var(--surface-3)}
.phase.done .bar{background:var(--accent)}
.phase.now .bar{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.phase .lbl{font-size:12px;margin-top:7px;color:var(--ink-3);white-space:nowrap}
.phase.done .lbl{color:var(--ink-2)}
.phase.now .lbl{color:var(--ink);font-weight:500}

/* Next appointment */
.next{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin:20px 0 18px;border-color:var(--accent-line);background:var(--accent-soft)}
.next .date{font-family:var(--font-display);font-size:34px;line-height:1;color:var(--accent);min-width:64px}
.next .date small{display:block;font-family:var(--font-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px;color:var(--ink-2)}
.next h2{font-size:17px;margin-bottom:2px}
.next .what{margin-top:4px}
@media (max-width:560px){.next{grid-template-columns:1fr}}

/* Decisions */
.decision{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.dec-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt .t{font-weight:500;font-size:14px} .opt .s{font-size:12.5px;color:var(--ink-3)}
.swatch{height:56px;border-radius:var(--r-sm)}
.swatch.oak-nat{background:linear-gradient(135deg,#D9B88C 0%,#C9A371 45%,#DAB98D 100%)}
.swatch.oak-smoke{background:linear-gradient(135deg,#8A6A4A 0%,#6B4F36 50%,#8A6A4A 100%)}
.docline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.docline svg{width:15px;height:15px;flex:none}
details.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.hist summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
details.hist[open] summary::before{transform:rotate(45deg)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.tick svg{width:12px;height:12px}

/* Lists */
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:4px}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;font-size:14.5px} .row .s{font-size:13px;color:var(--ink-3)}
.ext{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);flex:none}
.row .chip{flex:none}
label.task{cursor:pointer}
label.task input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
label.task.done .t{text-decoration:line-through;color:var(--ink-3);font-weight:400}

/* Timeline */
.tl{display:grid}
.tl-i{display:grid;grid-template-columns:56px 20px 1fr;gap:0 10px;align-items:start;min-height:54px}
.tl-d{font-size:12.5px;color:var(--ink-3);padding-top:3px;text-align:right;white-space:nowrap}
.tl-dot{position:relative;display:grid;justify-items:center;height:100%}
.tl-dot::before{content:"";position:absolute;top:18px;bottom:-4px;width:2px;background:var(--line);left:50%;transform:translateX(-50%)}
.tl-i:last-child .tl-dot::before{display:none}
.tl-dot span{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);margin-top:5px;position:relative;z-index:1}
.tl-i.done .tl-dot span{background:var(--accent);border-color:var(--accent)}
.tl-i.now .tl-dot span{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-i.next .tl-dot span{border-color:var(--accent)}
.tl-t{font-weight:500;font-size:14.5px} .tl-s{font-size:13px;color:var(--ink-3)}
.tl-i.now .tl-t{color:var(--accent)}

/* Budget blocks */
.pres{display:grid;gap:14px}
.pres-row{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.pres-row:first-child{border-top:0;padding-top:0}
.pres-row .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pres-row .h b{font-weight:500}
.track{height:8px;background:var(--surface-3);border-radius:2px;position:relative}
.fill{height:100%;border-radius:2px;background:var(--accent)}
.fill.over{background:var(--warn)}
.mark{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);transform:translateX(-1px)}
.pres-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px}
.big{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:3px 0 8px;line-height:1.1}
.pres-grid .s{font-size:13px;color:var(--ink-2);margin-top:6px}

/* Messages */
.thread{display:grid;gap:10px;max-height:300px;overflow:auto;padding-right:4px}
.bubble{max-width:88%;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.bubble.mine{margin-left:auto;background:var(--accent-soft)}
.bubble .meta{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.msg-form{display:flex;gap:8px;margin-top:12px}
.msg-form input{flex:1;min-width:0}

/* KPIs, tabs, tables */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.kpi .v{font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.kpi.warn .v{color:var(--warn)} .kpi.danger .v{color:var(--danger)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:42px;padding:0 13px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:6px 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .t{font-weight:500} td .s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--surface-2)}
tr.new td{background:var(--accent-soft)}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
th.right{text-align:right}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:14px;margin-bottom:16px}
.notice.danger{background:var(--danger-soft)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.notice.warn svg{color:var(--warn)} .notice.danger svg{color:var(--danger)}

/* Hours */
.bars{display:grid;gap:14px}
.bar-r{display:grid;grid-template-columns:minmax(130px,1fr) 2fr auto;gap:12px;align-items:center}
.bar-r .t{font-weight:500;font-size:14px} .bar-r .s{font-size:12.5px;color:var(--ink-3)}
.bar-r .val{font-size:13.5px;white-space:nowrap}
.over-t{color:var(--warn);font-weight:500}
.legend{display:inline-flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}
.legend i.m{width:2px;height:14px;background:var(--ink);border-radius:0}
@media (max-width:560px){.bar-r{grid-template-columns:1fr auto}.bar-r .track{grid-column:1/-1}}

/* Form */
.form{max-width:720px;margin:0 auto}
.form .intro{margin:8px 0 18px;max-width:60ch}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.steps span.on{background:var(--accent)}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>label,.field .lbl{font-size:14px;font-weight:500}
.field .hint{font-size:13px;color:var(--ink-3);margin-top:-2px}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;background:var(--surface);color:var(--ink-2)}
.chips button:hover{border-color:var(--ink-3)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.upload{border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;color:var(--ink-3);font-size:13.5px;cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;font-weight:400}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.form-nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.privacy{margin-top:22px;max-width:60ch}
dl.ficha{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:8px 16px;margin:0;font-size:14px}
dl.ficha dt{color:var(--ink-3)} dl.ficha dd{margin:0}
@media (max-width:480px){dl.ficha{grid-template-columns:1fr}dl.ficha dt{margin-top:6px}}

/* Phone frame */
.phone-wrap{display:flex;justify-content:center}
.phone{width:min(100%,410px);border:10px solid var(--band);border-radius:38px;background:var(--paper);box-shadow:var(--shadow-lg);overflow:hidden}
.phone-top{background:var(--band);color:var(--band-ink);padding:14px 18px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phone-top .brand-mark{font-size:22px}
.phone-top .u{font-size:12px;color:var(--band-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .client-body{padding:18px 16px 28px}
.phone .grid{grid-template-columns:1fr;gap:16px}
.phone .next{grid-template-columns:auto 1fr}
.phone .next .btn{display:none}
.phone .phase{min-width:78px}
@media (max-width:900px){.phone-toggle{display:none}}

/* Presenter notes */
.guion{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;width:min(360px,calc(100% - 32px));display:grid;justify-items:end;gap:10px}
.guion-panel{background:var(--band);color:var(--band-ink);border-radius:var(--r-lg);padding:14px 16px 16px;font-size:13.5px;box-shadow:var(--shadow-lg);width:100%}
.guion-panel .eyebrow{color:var(--band-dim)}
.guion-panel h3{font-family:var(--font-display);font-size:20px;font-weight:400;margin:4px 0 8px}
.guion-panel ul{margin:0;padding-left:16px;display:grid;gap:6px;line-height:1.45}
.guion-panel .ask{margin-top:10px;padding-top:10px;border-top:1px solid var(--band-line);color:var(--band-dim)}
.guion-toggle{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);opacity:.5;display:grid;place-items:center}
.guion-toggle:hover,.guion-toggle[aria-expanded="true"]{opacity:1}
.guion-toggle svg{width:15px;height:15px}

/* Photos */
.cover{margin:0 0 18px;border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:21/9;max-width:100%;background:var(--surface-2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover figcaption{position:absolute;left:14px;bottom:12px;background:rgba(20,28,22,.74);color:#F3F5F0;font-size:12.5px;padding:5px 11px;border-radius:999px}
.phone .cover{aspect-ratio:16/10;border-radius:var(--r)}
img.swatch{width:100%;height:96px;object-fit:cover;display:block}
.thumb{width:40px;height:40px;border-radius:var(--r-sm);object-fit:cover;flex:none;display:block;background:var(--surface-2)}
.thumb.lg{width:52px;height:52px}
.thumb.ph{background:var(--surface-3)}
.pcell{display:flex;gap:10px;align-items:center;min-width:200px}
.modal-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);margin:10px 0 12px;display:block}
.upl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.upl-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block}
.upl-grid .upload{aspect-ratio:4/3;display:grid;place-items:center;padding:8px}
@media (max-width:480px){.upl-grid{grid-template-columns:repeat(2,1fr)}}
.piece-img{width:calc(100% + 36px);margin:-18px -18px 14px;aspect-ratio:16/8;object-fit:cover;border-radius:var(--r-lg) var(--r-lg) 0 0;display:block;max-width:none}

/* Proposal */
.prop .lead{font-size:16.5px;max-width:64ch;margin:10px 0 22px}
.pieces .card h2{font-family:var(--font-display);font-size:24px;font-weight:400;margin:6px 0 8px}
.piece ul{margin:0 0 14px;padding-left:18px;font-size:14.5px;display:grid;gap:5px}
.piece li::marker{color:var(--ink-3)}
.steps-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px}
.st .t{font-weight:500;margin:4px 0 4px;font-size:15.5px}
.st .s{font-size:14px;color:var(--ink-2)}

/* Modal, toast, footer */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,11,.5);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:540px;width:100%;padding:22px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
.modal h3{font-family:var(--font-display);font-size:24px;font-weight:400;margin-bottom:8px}
.modal .muted{margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{min-height:32px;padding:0 12px;border-radius:var(--r-sm);font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:70;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 28px;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.mini-phases{display:flex;gap:4px;margin:10px 0 14px}
.mini-phases span{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.mini-phases span.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv div:nth-child(odd){color:var(--ink-3)}
.after{margin-top:14px}
</style>

/* ---------- state ---------- */
let S=load();S.ui={modal:null};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const base=defaults();for(const k in d){if(k in base)base[k]=d[k]}return base}}catch(e){}return defaults()}
function save(){try{const o={};for(const k in S){if(k!=='ui')o[k]=S[k]}localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function now(){const d=new Date();return d.getDate()+' '+MESES[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function today(){const s=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date());return s.charAt(0).toUpperCase()+s.slice(1)}
function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;clearTimeout(toast.tm);toast.tm=setTimeout(()=>el.remove(),2800)}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto'){if(r.dataset.themeByDemo){r.removeAttribute('data-theme');delete r.dataset.themeByDemo}}else{r.setAttribute('data-theme',S.theme);r.dataset.themeByDemo='1'}}

/* ---------- render ---------- */
function render(){
  applyTheme();
  const views={cliente:viewCliente,estudio:viewEstudio,cuestionario:viewForm,propuesta:viewPropuesta};

}

function tabRegistro(){
  return `<section class="card"><div class="card-h"><h2>Registro de decisiones y aprobaciones</h2><span class="count">Todos los proyectos</span></div><div class="tablewrap"><table><thead><tr><th>Cuándo</th><th>Proyecto</th><th>Decisión</th><th>Quién</th><th>Canal</th><th>Resultado</th></tr></thead><tbody>
  ${S.registro.map(r=>`<tr><td class="num" style="white-space:nowrap">${esc(r.at)}</td><td>${esc(r.p)}</td><td><div class="t">${esc(r.t)}</div></td><td>${esc(r.by)}</td><td>${esc(r.via)}</td><td>${r.k?`<span class="chip ${r.k}">${esc(r.res)}</span>`:esc(r.res)}</td></tr>`).join('')}
  </tbody></table></div><p class="note">Cada aprobación guarda fecha, hora, persona y canal. Si una decisión se toma en reunión o por teléfono, se registra a mano y el cliente la ve en su acta.</p></section>`;
}

/* ---------- intake form ---------- */
function txt(k,l,ph,type){return `<div class="field"><label for="f-${k}">${l}</label><input id="f-${k}" type="${type||'text'}" data-f="${k}" value="${esc(S.form.data[k])}" placeholder="${esc(ph||'')}" autocomplete="off"></div>`}
function area(k,l,ph){return `<div class="field"><label for="f-${k}">${l}</label><textarea id="f-${k}" data-f="${k}" placeholder="${esc(ph||'')}">${esc(S.form.data[k])}</textarea></div>`}
function chips(k,l,opts,multi,hint){const v=S.form.data[k];return `<div class="field"><span class="lbl">${l}</span>${hint?`<div class="hint">${hint}</div>`:''}<div class="chips">${opts.map(o=>{const on=multi?(v||[]).includes(o):v===o;return `<button type="button" data-a="chip" data-k="${k}" data-v="${esc(o)}" data-multi="${multi?1:0}" aria-pressed="${on}">${esc(o)}</button>`}).join('')}</div></div>`}
const STEP=[
  d=>`${txt('nombre','Nombre y apellidos','Maite Zubeldia')}<div class="two">${txt('email','Correo electrónico','','email')}${txt('tel','Teléfono','','tel')}</div>${chips('tipo','Tipo de espacio',['Vivienda','Local de hostelería','Oficina','Comercio','Otro'])}<div class="two">${txt('zona','Dirección o barrio','Gros, Donostia')}${txt('m2','Metros cuadrados aproximados','96','number')}</div>${chips('estado','Estado actual',['Sin reformar','Reforma parcial anterior','Obra nueva o local vacío','En uso, necesita cambios'])}`,
  d=>`${chips('alcance','Qué necesitas',['Reforma integral','Reforma parcial','Distribución y proyecto','Mobiliario y decoración','Licencia o cambio de uso','Dirección de obra'],true,'Puedes marcar varias.')}${chips('estancias','Estancias afectadas',['Cocina','Baños','Salón','Dormitorios','Zona de trabajo','Fachada o escaparate','Terraza o exterior','Todo el espacio'],true)}${chips('obra','¿Implica obra?',['Sí','No','No lo sé'])}`,
  d=>`${chips('estilo','Cómo lo imaginas',['Cálido y natural','Minimalista','Industrial','Clásico renovado','Colorista','Nórdico','Aún no lo sé'],true)}${area('refs','Referencias que te gustan','Enlaces de Pinterest o Instagram, o describe un sitio que te haya gustado.')}${area('noquiero','Lo que no quieres ver en tu espacio','Materiales, colores o soluciones que descartas de antemano.')}<div class="field"><span class="lbl">Fotos del espacio actual</span><div class="hint">3 fotos subidas · hasta 10 fotos o planos</div><div class="upl-grid"><img src="img/q1.jpg" alt="Salón actual"><img src="img/q2.jpg" alt="Cocina actual"><img src="img/q3.jpg" alt="Dormitorio actual"><div class="upload" data-a="noop" data-m="En el prototipo no se suben archivos.">+ Añadir</div></div></div>`,
  d=>`${chips('presupuesto','Presupuesto aproximado, sin contar honorarios',['Menos de 30.000 €','30.000 a 60.000 €','60.000 a 100.000 €','Más de 100.000 €','Prefiero hablarlo'],false,'Nos sirve para proponer soluciones realistas desde el primer día.')}${txt('fecha','¿Para cuándo te gustaría tenerlo listo?','Primavera de 2027')}${chips('flex','Flexibilidad de fechas',['Fecha fija','Algo flexible','Sin prisa'])}${chips('cond','Condicionantes',['Necesita licencia o permiso de la comunidad','Viviremos durante la obra','El local seguirá abierto','Es de alquiler','Financiación pendiente'],true)}`,
  d=>`${chips('canal','Cómo prefieres que nos comuniquemos',['Portal y correo','WhatsApp','Llamadas','Reuniones en el estudio'])}${chips('decide','Quién toma las decisiones',['Yo','En pareja','Varias personas o socios'])}${txt('dispo','¿Cuándo te viene bien reunirte?','Tardes a partir de las 17:00')}<div class="field"><label class="check"><input type="checkbox" data-f="ok" ${d.ok?'checked':''}><span>He leído cómo ${STUDIO.nombre} trata mis datos y acepto que los use para preparar la primera reunión.</span></label></div>`
];
function viewForm(){
  const f=S.form,d=f.data;
  if(f.enviado){
    return `<main class="page"><div class="form"><div class="eyebrow">Cuestionario inicial</div><h1>Gracias, ${esc((d.nombre||'').split(' ')[0])}.</h1><p class="muted intro">Hemos recibido tu información. Te escribimos en 48 horas para proponerte la primera reunión. Esto es lo que ha llegado al estudio:</p>
    <section class="card"><div class="card-h"><h2>Ficha de proyecto</h2><span class="chip ok">Creada automáticamente</span></div>${ficha(d)}</section>
    <div class="form-nav after"><button class="btn" data-a="form-reset">Rellenar otro</button><button class="btn primary" data-a="go-new">Ver la ficha en la vista Estudio</button></div></div></main>`;
  }
  return `<main class="page"><div class="form">
    <div class="eyebrow">Cuestionario inicial · paso ${f.step+1} de ${STEPS.length}</div>
    <h1>${STEPS[f.step]}</h1>
    <p class="muted intro">${INTRO[f.step]}</p>
    <div class="steps">${STEPS.map((s,i)=>`<span class="${i<=f.step?'on':''}"></span>`).join('')}</div>
    <form id="qform" data-form="q" novalidate>${STEP[f.step](d)}</form>
    <div class="form-nav">${f.step>0?`<button class="btn" data-a="form-prev">Atrás</button>`:'<span></span>'}${f.step<STEPS.length-1?`<button class="btn primary" data-a="form-next">Continuar</button>`:`<button class="btn primary" data-a="form-send">Enviar al estudio</button>`}</div>
    <p class="faint small privacy">Tus respuestas solo las usa ${STUDIO.nombre} para preparar la primera reunión. Puedes pedir que las borremos cuando quieras.</p>
  </div></main>`;
}
function ficha(d){
  const rows=[['Cliente',d.nombre],['Contacto',[d.email,d.tel].filter(Boolean).join(' · ')],['Espacio',[d.tipo,d.zona,d.m2?d.m2+' m²':''].filter(Boolean).join(' · ')],['Estado actual',d.estado],['Alcance',(d.alcance||[]).join(', ')],['Estancias',(d.estancias||[]).join(', ')],['Obra',d.obra],['Estilo',(d.estilo||[]).join(', ')],['Referencias',d.refs],['Descarta',d.noquiero],['Presupuesto',d.presupuesto],['Plazo',[d.fecha,d.flex].filter(Boolean).join(' · ')],['Condicionantes',(d.cond||[]).join(', ')],['Comunicación',d.canal],['Decide',d.decide],['Disponibilidad',d.dispo]].filter(r=>r[1]);
  return rows.length?`<dl class="ficha">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`:'<p class="empty">Sin datos: has enviado el cuestionario vacío.</p>';
}
function enviarForm(){
  const d=S.form.data;
  if(!(d.nombre||'').trim()||!d.tipo){S.form.step=0;save();render();toast('Falta el nombre o el tipo de espacio (paso 1).');return}
  const base={'Vivienda':'Vivienda','Local de hostelería':'Local','Oficina':'Oficinas','Comercio':'Tienda','Otro':'Proyecto'}[d.tipo]||'Proyecto';
  const tipo={'Vivienda':'Vivienda','Local de hostelería':'Hostelería','Oficina':'Oficina','Comercio':'Comercio','Otro':'Otro'}[d.tipo]||'Otro';
  const id='p'+Date.now();
  const n=base+(d.zona?' en '+d.zona.split(',')[0].trim():'');
  const nombre=d.nombre.trim();
  S.proyectos.unshift({id,n,c:nombre+(d.presupuesto?' · '+d.presupuesto:''),tipo,fase:0,hito:'Proponer fecha para la primera reunión',espera:'Estudio · responder en 48 h',resp:'ane',st:'ok',stl:'Nuevo',hp:0,hr:0});
  S.tareas.unshift({id:'t'+Date.now(),who:'ane',t:'Leer el cuestionario de '+nombre.split(' ')[0]+' y proponer fecha',p:n,when:'Hoy',done:false});
  S.newId=id;S.form.enviado=true;save();render();window.scrollTo({top:0});
  toast('Cuestionario enviado. La ficha ya está en la vista Estudio.');
}

/* ---------- proposal view ---------- */
function viewPropuesta(){
  return `<main class="page"><div class="prop">
    <div class="eyebrow">Lo del email, en tres piezas</div>
    <h1>Un sitio donde vive el método del estudio</h1>
    <p class="muted lead">Ni rehacer la web ni cambiar cómo diseñáis. Un espacio propio donde el cliente ve su proyecto, el equipo ve el suyo, y la información llega antes de la primera reunión.</p>
    <div class="grid c3 pieces">
      <section class="card piece"><img class="piece-img" src="img/prop-1.jpg" alt=""><div class="eyebrow">1 · Antes del proyecto</div><h2>Cuestionario inicial</h2><ul><li>El cliente lo rellena en diez minutos desde un enlace.</li><li>La ficha del proyecto se crea sola y aparece en la lista del estudio.</li><li>Filtro de criterios: presupuesto, plazo, alcance y quién decide.</li></ul><button class="btn small" data-a="view" data-v="cuestionario">Ver el cuestionario</button></section>
      <section class="card piece"><img class="piece-img" src="img/prop-2.jpg" alt=""><div class="eyebrow">2 · Durante el proyecto</div><h2>Portal del cliente</h2><ul><li>Propuestas, documentos y presupuestos en un solo sitio.</li><li>Decisiones pendientes con fecha límite y registro de quién y cuándo.</li><li>Próximos hitos, citas, mensajes y actas.</li></ul><button class="btn small" data-a="view" data-v="cliente">Ver la vista cliente</button></section>
      <section class="card piece"><img class="piece-img" src="img/prop-3.jpg" alt=""><div class="eyebrow">3 · Dentro del estudio</div><h2>Vista interna</h2><ul><li>Proyectos con «esperando a» y semáforo.</li><li>Tareas, proveedores y pedidos, presupuestos y cobros.</li><li>Horas por proyecto para fijar criterios con datos.</li></ul><button class="btn small" data-a="view" data-v="estudio">Ver la vista estudio</button></section>
    </div>
    <section class="card"><div class="card-h"><h2>Cómo seguiríamos</h2><span class="count">Pasos pequeños, cada uno útil por sí solo</span></div>
      <div class="steps-row">
        <div class="st"><div class="eyebrow">Paso 1</div><div class="t">Mapa de procesos</div><div class="s">Dos sesiones de hora y media en el estudio. Cómo trabajáis hoy, cómo queréis trabajar y qué merece la pena cambiar. Os sirve aunque ahí se quede.</div></div>
        <div class="st"><div class="eyebrow">Paso 2</div><div class="t">Piloto con un proyecto real</div><div class="s">Cuestionario y portal del cliente, estrenados con un proyecto que esté empezando. Seis semanas.</div></div>
        <div class="st"><div class="eyebrow">Paso 3</div><div class="t">Vista interna y automatizaciones</div><div class="s">Solo si el piloto demuestra que compensa: proveedores, cobros, horas, avisos.</div></div>
      </div>
      <p class="note">Se construye sobre vuestro proceso, no al revés. Precio cerrado antes de empezar, sin cuotas obligatorias, y lo construido es vuestro: código, datos y dominio.</p>
    </section>
  </div></main>`;
}

/* ---------- presenter notes, modal ---------- */
function guion(){
  const g=GUION[S.view]||GUION.cliente;
  return `<div class="guion">${S.guion?`<div class="guion-panel"><div class="eyebrow">Notas para Naia · tecla N para ocultarlas</div><h3>${g.h}</h3><ul>${g.pts.map(p=>`<li>${p}</li>`).join('')}</ul><div class="ask">${g.ask}</div></div>`:''}<button class="guion-toggle" data-a="guion" aria-expanded="${S.guion}" aria-label="Notas para la presentación" title="Notas para la presentación (N)">${I.pen}</button></div>`;
}
function modal(){
  const m=S.ui.modal;if(!m)return '';
  let b='';
  if(m.type==='settings'){
    b=`<h3>Ajustes de la demo</h3><p class="muted small">Prototipo de Ondora Studio para mostrar cómo podría funcionar un portal de proyectos en un estudio de interiorismo. ${STUDIO.nombre}, su equipo, sus clientes y sus proveedores son ficticios. Lo que cambies se guarda solo en este dispositivo.</p>
    <div class="field"><span class="lbl">Tema</span><div class="seg">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>`<button data-a="theme" data-v="${k}" aria-pressed="${S.theme===k}">${l}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Notas para la presentación</span><div class="hint">Un panel con los puntos que contar en cada pantalla. También se abre y se cierra con la tecla N.</div><div class="seg"><button data-a="guion-set" data-v="1" aria-pressed="${S.guion}">Visibles</button><button data-a="guion-set" data-v="0" aria-pressed="${!S.guion}">Ocultas</button></div></div>
    <div class="field"><span class="lbl">Volver al punto de partida</span><div class="hint">Borra las decisiones, tareas y fichas creadas en este dispositivo y vuelve a los datos de ejemplo.</div><div><button class="btn" data-a="reset">Restablecer la demo</button></div></div>
    <div class="modal-foot"><button class="btn primary" data-a="close">Cerrar</button></div>`;
  }else if(m.type==='ask'){
    b=`<h3>Tengo una duda</h3><p class="muted small">Sobre: ${esc(m.t)}. Ane recibe la pregunta y la respuesta queda junto a la decisión.</p><div class="field"><textarea id="askText" placeholder="Escribe tu pregunta…"></textarea></div><div class="modal-foot"><button class="btn" data-a="close">Cancelar</button><button class="btn primary" data-a="ask-send" data-id="${m.id}">Enviar</button></div>`;
  }else if(m.type==='proj'){
    const p=S.proyectos.find(x=>x.id===m.id);if(!p)return '';
    b=`<div class="eyebrow">${esc(p.tipo)} · ${PHASES[p.fase]}</div><h3>${esc(p.n)}</h3>${p.img?`<img class="modal-img" src="img/${p.img}" alt="">`:''}<div class="mini-phases">${PHASES.map((x,i)=>`<span class="${i<=p.fase?'on':''}"></span>`).join('')}</div>
    <div class="kv"><div>Cliente</div><div>${esc(p.c)}</div><div>Próximo hito</div><div>${esc(p.hito)}</div><div>Esperando a</div><div>${esc(p.espera)}</div><div>Responsable</div><div>${esc(TEAM[p.resp].n)}</div><div>Horas</div><div class="num">${p.hr} h de ${p.hp} previstas</div><div>Estado</div><div><span class="chip ${p.st==='ok'?'':p.st}">${esc(p.stl)}</span></div></div>
    <p class="muted small">En el producto real, desde aquí se abren los documentos, el presupuesto, el registro de decisiones y la vista exacta que tiene este cliente.</p>
    <div class="modal-foot">${p.id==='p1'?`<button class="btn" data-a="view" data-v="cliente">Abrir la vista del cliente</button>`:''}<button class="btn primary" data-a="close">Cerrar</button></div>`;
  }
  return `<div class="modal-bg" data-a="close-bg"><div class="modal" role="dialog" aria-modal="true">${b}</div></div>`;
}

/* ---------- actions ---------- */
function decide(id,how,k){
  const d=S.decisions.find(x=>x.id===id);if(!d)return;
  d.estado='decidida';d.by=CLIENT.persona;d.at=now();d.via='Portal';
  if(how==='choose'){const o=d.opts.find(x=>x.k===k);d.res='Elegida la opción '+k+': '+o.t}
  else if(how==='approve'){d.res='Aprobada'+(d.importe?' · '+d.importe:'')}
  else{d.res='Pide otra opción'}
  S.registro.unshift({at:d.at,p:CLIENT.proyecto,t:d.t,by:d.by,via:'Portal',res:d.res,k:how==='reject'?'warn':'ok'});
  const p=S.proyectos.find(x=>x.id==='p1');
  const left=S.decisions.filter(x=>x.estado==='pendiente').length;
  if(p){p.espera=left?'Cliente · '+left+(left===1?' decisión':' decisiones'):'Estudio · preparar la reunión de materiales';p.st=left?'warn':'ok';p.stl=left?'Atención':'Al día'}
  save();render();
  toast(how==='reject'?'Registrado. Ane te propondrá alternativas.':'Decisión registrada. El estudio recibe el aviso.');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='close-bg'){if(e.target===el){S.ui.modal=null;render()}return}
  switch(a){
    case 'view':S.view=el.dataset.v;S.ui.modal=null;save();render();window.scrollTo({top:0});break;
    case 'tab':S.tab=el.dataset.t;save();render();break;
    case 'mobile':S.mobile=!S.mobile;save();render();break;
    case 'settings':S.ui.modal={type:'settings'};render();break;
    case 'close':S.ui.modal=null;render();break;
    case 'theme':S.theme=el.dataset.v;save();render();break;
    case 'guion':S.guion=!S.guion;save();render();break;
    case 'guion-set':S.guion=el.dataset.v==='1';save();render();break;
    case 'reset':try{localStorage.removeItem(KEY)}catch(x){}S=defaults();S.ui={modal:null};render();toast('Demo restablecida.');break;
    case 'noop':toast(el.dataset.m||'Esta parte no está en el prototipo.');break;
    case 'choose':decide(el.dataset.id,'choose',el.dataset.k);break;
    case 'approve':decide(el.dataset.id,'approve');break;
    case 'reject':decide(el.dataset.id,'reject');break;
    case 'ask':{const d=S.decisions.find(x=>x.id===el.dataset.id);if(!d)break;S.ui.modal={type:'ask',id:d.id,t:d.t};render();setTimeout(()=>{const t=document.getElementById('askText');if(t)t.focus()},30);break}
    case 'ask-send':{const ta=document.getElementById('askText');const t=ta?ta.value.trim():'';if(!t){toast('Escribe la pregunta antes de enviar.');return}const d=S.decisions.find(x=>x.id===el.dataset.id);S.mensajes.push({de:'Maite',at:now(),t:'Sobre «'+(d?d.t:'')+'»: '+t,mine:true});S.ui.modal=null;save();render();toast('Pregunta enviada. Ane la recibe por correo y responde aquí.');break}
    case 'proj':S.ui.modal={type:'proj',id:el.dataset.id};render();break;
    case 'chip':{const k=el.dataset.k,v=el.dataset.v;if(el.dataset.multi==='1'){const arr=S.form.data[k]||[];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);S.form.data[k]=arr}else{S.form.data[k]=S.form.data[k]===v?'':v}save();render();break}
    case 'form-next':S.form.step=Math.min(STEPS.length-1,S.form.step+1);save();render();window.scrollTo({top:0});break;
    case 'form-prev':S.form.step=Math.max(0,S.form.step-1);save();render();window.scrollTo({top:0});break;
    case 'form-send':enviarForm();break;
    case 'form-reset':S.form=defaults().form;S.newId=null;save();render();break;
    case 'go-new':S.view='estudio';S.tab='proyectos';save();render();window.scrollTo({top:0});break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form');if(!f)return;e.preventDefault();
  if(f.dataset.form==='msg'){const i=document.getElementById('msgText');const t=i?i.value.trim():'';if(!t){toast('Escribe un mensaje antes de enviar.');return}S.mensajes.push({de:'Maite',at:now(),t,mine:true});save();render();toast('Mensaje enviado. Ane lo recibe en el estudio.');const th=document.getElementById('thread');if(th)th.scrollTop=th.scrollHeight}
  if(f.dataset.form==='q'){const btn=document.querySelector('[data-a="form-next"],[data-a="form-send"]');if(btn)btn.click()}
});
document.addEventListener('input',e=>{const k=e.target.dataset?e.target.dataset.f:null;if(!k)return;S.form.data[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save()});
document.addEventListener('change',e=>{const id=e.target.dataset?e.target.dataset.task:null;if(!id)return;const t=S.tareas.find(x=>x.id===id);if(t){t.done=e.target.checked;save();render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ui.modal){S.ui.modal=null;render();return}
  const tag=(document.activeElement||{}).tagName||'';
  if((e.key==='n'||e.key==='N')&&!/INPUT|TEXTAREA|SELECT/.test(tag)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){S.guion=!S.guion;save();render()}
});
window.addEventListener('resize',()=>{if(S.mobile)render()});
render();
</script>
</body>
</html>
